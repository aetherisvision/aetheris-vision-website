ht="700" fill="#d9a066" text-anchor="middle">RAIN  (warmer column)</text><circle cx="300" cy="300.0" r="7" fill="#d9a066"/><text x="314" y="306.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#e7edf0" text-anchor="start">shallow cold air → freezing rain</text><circle cx="680" cy="260.0" r="7" fill="#d9a066"/><text x="694" y="266.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#e7edf0" text-anchor="start">elevation → snow at 'rain' thickness</text><circle cx="880" cy="335.0" r="7" fill="#d9a066"/><text x="894" y="341.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#e7edf0" text-anchor="start">warm nose aloft → sleet</text><text x="600" y="530" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#8fa6b8" text-anchor="middle">The rule is physics made fast; the exceptions are where the craft lived.</text>
