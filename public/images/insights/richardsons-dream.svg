<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#7eabca"/>
</marker>
</defs>
<rect width="1200" height="560" fill="#0a1628"/>
<text x="600" y="58" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="600" fill="#e7edf0" text-anchor="middle">From a stated problem to operational forecasting</text><line x1="90" y1="300" x2="1110" y2="300" stroke="#7eabca" stroke-width="3" opacity="1.0"/><circle cx="160" cy="300" r="11" fill="#122339" stroke="#7eabca" stroke-width="3"/><text x="160" y="270" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#9bc3df" text-anchor="middle">1904</text><text x="160" y="348" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#e7edf0" text-anchor="middle">Bjerknes states</text><text x="160" y="376" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#e7edf0" text-anchor="middle">the problem</text><text x="160" y="412" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#8fa6b8" text-anchor="middle">7 equations, 7 unknowns</text><circle cx="440" cy="300" r="11" fill="#122339" stroke="#7eabca" stroke-width="3"/><text x="440" y="270" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#9bc3df" text-anchor="middle">1922</text><text x="440" y="348" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#e7edf0" text-anchor="middle">Richardson computes</text><text x="440" y="376" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#e7edf0" text-anchor="middle">by hand</text><text x="440" y="412" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#8fa6b8" text-anchor="middle">+145 hPa in 6 h (observed ~0)</text><circle cx="740" cy="300" r="11" fill="#122339" stroke="#7eabca" stroke-width="3"/><text x="740" y="270" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#9bc3df" text-anchor="middle">1950</text><text x="740" y="348" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#e7edf0" text-anchor="middle">Charney, Fjørtoft,</text><text x="740" y="376" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#e7edf0" text-anchor="middle">von Neumann on ENIAC</text><text x="740" y="412" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#8fa6b8" text-anchor="middle">24-h barotropic forecast</text><circle cx="1030" cy="300" r="11" fill="#122339" stroke="#7eabca" stroke-width="3"/><text x="1030" y="270" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#9bc3df" text-anchor="middle">1954–55</text><text x="1030" y="348" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#e7edf0" text-anchor="middle">Routine operations</text><text x="1030" y="376" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#e7edf0" text-anchor="middle">Stockholm, then JNWPU</text><text x="1030" y="412" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#8fa6b8" text-anchor="middle">Air Force, Navy, Weather Bureau</text><rect x="320" y="78" width="250" height="150" rx="10" fill="#122339" stroke="#29426c" stroke-width="1.5"/><text x="445" y="104" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#8fa6b8" text-anchor="middle">6-h pressure change</text><rect x="350" y="124" width="44" height="82" fill="#d9a066" opacity="0.9"/><text x="402" y="150" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#e7edf0" text-anchor="start">+145 hPa</text><rect x="490" y="202" width="44" height="4" fill="#6fa3d8"/><text x="512" y="190" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#e7edf0" text-anchor="middle">~0</text><text x="372" y="221" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#8fa6b8" text-anchor="middle">forecast</text><text x="512" y="221" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#8fa6b8" text-anchor="middle">observed</text><line x1="445" y1="231" x2="440" y2="252" stroke="#29426c" stroke-width="2.5" marker-end="url(#arr)"/><text x="600" y="520" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#8fa6b8" text-anchor="middle">The equations were right; the unbalanced initial state was the failure — a lesson that outlived the hardware.</text>
</svg>
