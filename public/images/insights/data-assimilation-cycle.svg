<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#7eabca"/>
</marker>
</defs>
<rect width="1200" height="560" fill="#0a1628"/>
<text x="600" y="58" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="600" fill="#e7edf0" text-anchor="middle">The assimilation cycle</text><rect x="70" y="150" width="300" height="96" rx="10" fill="#122339" stroke="#29426c" stroke-width="1.5"/><text x="220.0" y="190.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="25" font-weight="600" fill="#e7edf0" text-anchor="middle">Background</text><text x="220.0" y="223.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#8fa6b8" text-anchor="middle">previous 6-h forecast</text><rect x="450" y="150" width="300" height="96" rx="10" fill="#122339" stroke="#29426c" stroke-width="1.5"/><text x="600.0" y="190.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="25" font-weight="600" fill="#e7edf0" text-anchor="middle">Analysis</text><text x="600.0" y="223.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#8fa6b8" text-anchor="middle">minimize J(x): background + obs</text><rect x="830" y="150" width="300" height="96" rx="10" fill="#122339" stroke="#29426c" stroke-width="1.5"/><text x="980.0" y="190.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="25" font-weight="600" fill="#e7edf0" text-anchor="middle">Forecast</text><text x="980.0" y="223.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#8fa6b8" text-anchor="middle">0–10 days, every 6 h</text><line x1="372" y1="198" x2="448" y2="198" stroke="#7eabca" stroke-width="2.5" marker-end="url(#arr)"/><line x1="752" y1="198" x2="828" y2="198" stroke="#7eabca" stroke-width="2.5" marker-end="url(#arr)"/><rect x="450" y="330" width="300" height="96" rx="10" fill="#122339" stroke="#29426c" stroke-width="1.5"/><text x="600.0" y="370.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="25" font-weight="600" fill="#e7edf0" text-anchor="middle">Observations</text><text x="600.0" y="403.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#8fa6b8" text-anchor="middle">radiosondes · satellites · aircraft · surface</text><line x1="600" y1="328" x2="600" y2="250" stroke="#7eabca" stroke-width="2.5" marker-end="url(#arr)"/><path d="M 980 248 L 980 470 L 220 470 L 220 250" stroke="#7eabca" stroke-width="2.5" fill="none" opacity="1.0" stroke-dasharray="7 7"/><path d="M 214 258 L 220 246 L 226 258 z" fill="#7eabca"/><text x="600" y="495" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#8fa6b8" text-anchor="middle">next cycle: the 6-h forecast becomes the new background</text><text x="600" y="528" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#8fa6b8" text-anchor="middle">Run this loop backward over decades of archived observations and you get a reanalysis — the data AI models train on.</text>
</svg>
