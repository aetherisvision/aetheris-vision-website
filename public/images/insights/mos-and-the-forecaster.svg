<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#7eabca"/>
</marker>
</defs>
<rect width="1200" height="560" fill="#0a1628"/>
<text x="600" y="58" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="600" fill="#e7edf0" text-anchor="middle">From model fields to a station forecast — and the forecaster in the loop</text><rect x="40" y="170" width="250" height="110" rx="10" fill="#122339" stroke="#29426c" stroke-width="1.5"/><text x="165.0" y="217.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="600" fill="#e7edf0" text-anchor="middle">Model fields</text><text x="165.0" y="249.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#8fa6b8" text-anchor="middle">pressure, wind, T on a grid</text><rect x="340" y="170" width="250" height="110" rx="10" fill="#122339" stroke="#29426c" stroke-width="1.5"/><text x="465.0" y="217.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="600" fill="#e7edf0" text-anchor="middle">MOS equations</text><text x="465.0" y="249.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#8fa6b8" text-anchor="middle">regression vs. years of obs</text><rect x="640" y="170" width="250" height="110" rx="10" fill="#122339" stroke="#29426c" stroke-width="1.5"/><text x="765.0" y="217.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="600" fill="#e7edf0" text-anchor="middle">Station forecast</text><text x="765.0" y="249.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#8fa6b8" text-anchor="middle">max/min T · PoP · wind · ceiling</text><rect x="940" y="170" width="220" height="110" rx="10" fill="#122339" stroke="#29426c" stroke-width="1.5"/><text x="1050.0" y="217.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="600" fill="#e7edf0" text-anchor="middle">Forecaster</text><text x="1050.0" y="249.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#8fa6b8" text-anchor="middle">review · adjust · issue</text><line x1="292" y1="225" x2="338" y2="225" stroke="#7eabca" stroke-width="2.5" marker-end="url(#arr)"/><line x1="592" y1="225" x2="638" y2="225" stroke="#7eabca" stroke-width="2.5" marker-end="url(#arr)"/><line x1="892" y1="225" x2="938" y2="225" stroke="#7eabca" stroke-width="2.5" marker-end="url(#arr)"/><path d="M 1050 282 L 1050 400 L 465 400 L 465 284" stroke="#7eabca" stroke-width="2.5" fill="none" opacity="1.0" stroke-dasharray="7 7"/><path d="M 459 292 L 465 280 L 471 292 z" fill="#7eabca"/><text x="757" y="390" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#8fa6b8" text-anchor="middle">verification: who beat whom, and where</text><text x="600" y="470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#8fa6b8" text-anchor="middle">MOS removes bias and adds climatology; it hedges toward the mean and cannot see a bad initialization.</text><text x="600" y="500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#8fa6b8" text-anchor="middle">The forecaster's value lives at the extremes, in the mesoscale, and in knowing when not to edit.</text>
</svg>
