name: CI

on:
  push:
    branches-ignore:
      - main        # feature/fix branches only — Vercel owns the main deploy pipeline
  pull_request:
    branches:
      - main        # every PR targeting main runs all checks

env:
  GITLAB_REPO: https://gitlab.com/aetheris-vision-group/aetheris-vision-project.git

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (0 errors, max 24 warnings)
        run: npm run lint -- --max-warnings=24
        # Ratchet: lower this number as warnings are cleaned up.
        # Current baseline 2026-05-22: 24 warnings (all non-blocking categories).
        # Any new error → CI fails immediately.

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  cucumber:
    name: Cucumber BDD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Gherkin features (cucumber-js)
        run: npm run test:cucumber

  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, cucumber]   # only build if all checks pass
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        # Build-time placeholders only: nothing in the build reads a live
        # service, and keeping production secrets out of CI means a
        # compromised action or dependency cannot exfiltrate them.
        env:
          PREVIEW_PASSWORD: ci-placeholder
          DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
          NEXTAUTH_SECRET: ci-placeholder-secret
          NEXTAUTH_URL: https://aetherisvision.com
          RESEND_API_KEY: re_placeholder
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          ANTHROPIC_API_KEY: sk-ant-placeholder

