name: CI

on:
  push:
  workflow_dispatch:
  pull_request:
    branches:
      - main        # every PR targeting main runs all checks

env:
  GITLAB_REPO: https://gitlab.com/aetheris-vision-group/aetheris-vision-project.git

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (0 errors, max 24 warnings)
        run: npm run lint -- --max-warnings=24
        # Ratchet: lower this number as warnings are cleaned up.
        # Current baseline 2026-05-22: 24 warnings (all non-blocking categories).
        # Any new error → CI fails immediately.

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  cucumber:
    name: Cucumber BDD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Gherkin features (cucumber-js)
        run: npm run test:cucumber

  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, cucumber]   # only build if all checks pass
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        # Build-time placeholders only: nothing in the build reads a live
        # service, and keeping production secrets out of CI means a
        # compromised action or dependency cannot exfiltrate them.
        env:
          PREVIEW_PASSWORD: ci-placeholder
          DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
          NEXTAUTH_SECRET: ci-placeholder-secret
          NEXTAUTH_URL: https://aetherisvision.com
          RESEND_API_KEY: re_placeholder
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          ANTHROPIC_API_KEY: sk-ant-placeholder

  deploy-gcp:
    name: Deploy GCP production
    needs: build
    if: github.ref == 'refs/heads/main' && vars.GCP_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: gcp-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      CLOUDSDK_CORE_PROJECT: lucid-loader-493512-g1
      CLOUDSDK_BILLING_QUOTA_PROJECT: lucid-loader-493512-g1
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: lucid-loader-493512-g1
          workload_identity_provider: projects/169759401670/locations/global/workloadIdentityPools/av-crm-github/providers/github
          service_account: av-crm-deploy@lucid-loader-493512-g1.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build production image without application secrets
        id: image
        env:
          TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          set -euo pipefail
          test -n "$TURNSTILE_SITE_KEY"
          build_id=$(gcloud builds submit . --config=cloudbuild.yaml --ignore-file=.dockerignore \
            --region=us-central1 --suppress-logs --quiet --format='value(id)' \
            --service-account=projects/lucid-loader-493512-g1/serviceAccounts/av-crm-build@lucid-loader-493512-g1.iam.gserviceaccount.com \
            --substitutions="_TAG=$GITHUB_SHA,_TURNSTILE_SITE_KEY=$TURNSTILE_SITE_KEY")
          digest=$(gcloud builds describe "$build_id" --region=us-central1 --format='value(results.images[0].digest)')
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Refresh deployment identity
        uses: google-github-actions/auth@v3
        with:
          project_id: lucid-loader-493512-g1
          workload_identity_provider: projects/169759401670/locations/global/workloadIdentityPools/av-crm-github/providers/github
          service_account: av-crm-deploy@lucid-loader-493512-g1.iam.gserviceaccount.com
      - name: Deploy verified image
        id: deploy
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          # Remember the serving revision so a failed smoke test can restore it.
          previous=$(gcloud run services describe av-crm-web --region=us-central1 \
            --format='value(status.traffic[0].revisionName)')
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          gcloud run services update av-crm-web --region=us-central1 --quiet \
            --image="us-central1-docker.pkg.dev/lucid-loader-493512-g1/av-crm/website@$IMAGE_DIGEST"
          # A previous rollback pins traffic to a named revision; make sure the
          # new revision actually receives traffic.
          gcloud run services update-traffic av-crm-web --region=us-central1 --quiet --to-latest
      - name: Smoke test the public origin
        id: smoke
        run: |
          set -euo pipefail
          origin=https://aetherisvision.com
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$origin/")" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$origin/api/admin/leads")" = 401
          # Same-origin browser POST must not be rejected as cross-origin. An
          # empty JSON body fails validation (400) before any side effect, so
          # anything other than 403 proves the origin check sees the public host.
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$origin/api/contact" \
            -H "Origin: $origin" -H 'Sec-Fetch-Site: same-origin' \
            -H 'Content-Type: application/json' --data '{}')
          echo "POST /api/contact -> $code"
          test "$code" != 403
          # Route-handler redirects must carry the public host, not the
          # container listener address. An empty form never touches the database.
          location=$(curl -sS -o /dev/null -w '%{redirect_url}' -X POST "$origin/api/auth/magic" \
            -H 'Content-Type: application/x-www-form-urlencoded' --data 'token=&email=')
          echo "POST /api/auth/magic -> $location"
          case "$location" in
            "$origin"/*) ;;
            *) echo "redirect left the public origin"; exit 1 ;;
          esac
      - name: Roll back traffic to the previous revision
        if: failure() && steps.smoke.conclusion == 'failure' && steps.deploy.outputs.previous != ''
        env:
          PREVIOUS_REVISION: ${{ steps.deploy.outputs.previous }}
        run: |
          set -euo pipefail
          gcloud run services update-traffic av-crm-web --region=us-central1 --quiet \
            --to-revisions="$PREVIOUS_REVISION=100"
          echo "::error::Smoke test failed; traffic restored to $PREVIOUS_REVISION"
